<!DOCTYPE html>
<html lang="en">
<head>
  <title>Cart Quantity</title>
</head>
<body>
  <button onclick="
    console.log(`cartQuantity: ${cartQuantity}`);
    ">Show Quantity</button>

  <button onclick="
    checkQuantity(cartQuantity + 1) ?undefined :cartQuantity++;
    console.log(`cartQuantity: ${cartQuantity}`);
    ">Add to cart</button>

  <button onclick="
    checkQuantity(cartQuantity + 1) ?undefined :cartQuantity += 2;
    console.log(`cartQuantity: ${cartQuantity}`);
    ">+2</button>

  <button onclick="
    checkQuantity(cartQuantity + 3) ?undefined :cartQuantity += 3;
    console.log(`cartQuantity: ${cartQuantity}`);
    ">+3</button>

  <button onclick="
    checkQuantity(cartQuantity + 4) ?undefined :cartQuantity += 4;
    console.log(`cartQuantity: ${cartQuantity}`);
    ">+4</button>

  <button onclick="
    checkQuantity(cartQuantity + 5) ?undefined :cartQuantity += 5;
    console.log(`cartQuantity: ${cartQuantity}`);
    ">+5</button>

  <button onclick="
    checkQuantity(cartQuantity-2) ?undefined :cartQuantity -= 2;
    console.log(`cartQuantity: ${cartQuantity}`);
    ">-2</button>

  <button onclick="
    checkQuantity(cartQuantity-3) ?undefined :cartQuantity -= 3;
    console.log(`cartQuantity: ${cartQuantity}`);
    ">-3</button>

<button onclick="
    checkQuantity(cartQuantity-1) ?undefined :cartQuantity--;
    console.log(`cartQuantity: ${cartQuantity}`);
    ">Remove from cart</button>

  <button onclick="
    cartQuantity=0;
    console.log('Cart was rest.');
    console.log(`cartQuantity: ${cartQuantity}`);
    ">Reset Cart</button>


  <script>
    let cartQuantity = 0;
    function checkQuantity(cartQuantity) {
      if(cartQuantity >10) {
        alert('The cart is full!');
        return true;
      } else if(cartQuantity < 0) {
        alert('Not enough items in the cart!');
        return true;
      }
    }
  </script>
</body>
</html>
