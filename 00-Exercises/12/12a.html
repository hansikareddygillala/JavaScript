<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
</head>
<body>
  <button 
    class = "start-button"
    onclick="finished();"
  >Start</button>
  <p></p>

  <button
    class = "add-to-cart-button"
    onclick = "addToCartButton();"
  >Add to Cart</button>
  <p class="added-para"></p>

  <script>
    const add = function() {
      console.log(2+3);
    }
    add();
    add();

    function runTwice(fun) {
      fun();
      fun();
    }
    runTwice(add);
    runTwice(function() {
      console.log("12b");
    });

    function finished() {
      document.querySelector(".start-button").innerHTML = "Loading!";      
      setTimeout(function() {
        document.querySelector(".start-button").innerHTML = "Finished!";
      }, 1000);
    }

    let timeoutId;

    function addToCartButton() {
      document.querySelector(".added-para").innerHTML = "Added";
        clearTimeout(timeoutId);
        timeoutId = setTimeout(function() {
        document.querySelector(".added-para").innerHTML = "";
        }, 2000);
    }
  </script>
</body>
</html>
