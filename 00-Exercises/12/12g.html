<!DOCTYPE html>
<html lang="en">
<head>
  <title>Message</title>
</head>
<body>
  <button onclick="messages++">Add</button>
  <button onclick="msgRemove()">Remove</button>
  <script>
    let messages = 2
    let intervalId = setInterval(function() {
      if(messages > 0) {
        setTimeout(function() {
          document.title = `(${messages}) New Messages`;
        }, 500);
        setTimeout(function() {
          document.title = "Apps";
        }, 1000);
      } else {
        document.title = "Apps";
      }
      if(messages === 0) {
        clearInterval(intervalId);
      }
    }, 1000);

    function msgRemove() {
      if (messages > 0) {
        messages--;
      } else {
        document.title = "Apps";
      }
    }
  </script>
</body>
</html>
