<!DOCTYPE html>
<html lang="en">
<head>
  <title>Cart Quantity</title>
</head>
<body>
  <button onclick="
    displayCartQuantity(cartQuantity);
    ">Show Quantity</button>

  <button onclick="
    checkQuantity(cartQuantity + 1) ?undefined :cartQuantity++;
    displayCartQuantity(cartQuantity);
    ">Add to cart</button>

  <button onclick="
    checkQuantity(cartQuantity + 1) ?undefined :cartQuantity += 2;
    displayCartQuantity(cartQuantity);
    ">+2</button>

  <button onclick="
    checkQuantity(cartQuantity + 3) ?undefined :cartQuantity += 3;
    displayCartQuantity(cartQuantity);
    ">+3</button>

  <button onclick="
    checkQuantity(cartQuantity + 4) ?undefined :cartQuantity += 4;
    displayCartQuantity(cartQuantity);
    ">+4</button>

  <button onclick="
    checkQuantity(cartQuantity + 5) ?undefined :cartQuantity += 5;
    displayCartQuantity(cartQuantity);
    ">+5</button>

  <button onclick="
    checkQuantity(cartQuantity-2) ?undefined :cartQuantity -= 2;
    displayCartQuantity(cartQuantity);
    ">-2</button>

  <button onclick="
    checkQuantity(cartQuantity-3) ?undefined :cartQuantity -= 3;
    displayCartQuantity(cartQuantity);
    ">-3</button>

<button onclick="
    checkQuantity(cartQuantity-1) ?undefined :cartQuantity--;
    displayCartQuantity(cartQuantity);
    ">Remove from cart</button>

  <button onclick="
    cartQuantity=0;
    displayCartQuantity(cartQuantity);
    ">Reset Cart</button>

  <p class="js-cart-quantity"></p>


  <script>
    let cartQuantity = 0;
    displayCartQuantity(cartQuantity);
    function checkQuantity(cartQuantity) {
      if(cartQuantity >10) {
        alert('The cart is full!');
        return true;
      } else if(cartQuantity < 0) {
        alert('Not enough items in the cart!');
        return true;
      }
    }

    function displayCartQuantity(cartQuantity) {
      document.querySelector('.js-cart-quantity').innerHTML = `Cart Quantity: ${cartQuantity}`;
    }
  </script>
</body>
</html>
