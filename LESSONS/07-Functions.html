    //PARAMETERS IN FUNCTIONS.

    function calculateTax(cost,taxPercent = 0.1) {//This function takes a parameter.
      console.log(taxPercent);
      console.log(cost * taxPercent);
    }

    //Calling the function.
    calculateTax(2000, 0.2);//Passing a value into the function / argument.
    calculateTax(5000);//Argument//We get undefines and NaN 
    //we can even set a default value for the parameter.
  </script>
