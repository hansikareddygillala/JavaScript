      if(i % 3 === 0) {
        continue;
      }
      console.log(i);
      if(i === 8) {
        break;
      }
    }

    let i = 0;
    while(i<10) {
      if(i % 3 === 0) {
        i++;//continue will skip the rest of the code in the loop and move to the next iteration, so we need to make sure to increment i before continue to avoid infinite loop
        continue;
      }
      console.log(i);
      i++
    }


    function doubleArray(nums) {
    
      const numsDoubled = [];
      for(let i = 0; i < nums.length; i++) {
        const num = nums[i];
        if (num == 0) {
          return numsDoubled;//it stops the loop just like using break and return the current state of numsDoubled
        }
        numsDoubled.push(nums[i] * 2);
      }
      return numsDoubled;
    }

    console.log(doubleArray([1,2,3]));
    console.log(doubleArray([1,5,8,3,0,3]));
