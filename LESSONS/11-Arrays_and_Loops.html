   //Problem : We have an array of numbers and we want to find the sum of all the numbers in the array.
    const nums = [1,1,3];
    let sum = 0;
    for(let i = 0; i < nums.length; i++) {
      sum += nums[i];
    }
    console.log(sum);

    const numsDoubled = [];
    for(let i = 0; i < nums.length; i++) {
      numsDoubled.push(nums[i] * 2);
    }
    console.log(numsDoubled);
