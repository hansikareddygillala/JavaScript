<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
      function comparePrice(product1, product2) {
      if (product1.price > product2.price) {
        return product2.price;
      } else {
        return product1.price;
      }
    }
    function isSameProduct(product1, product2) {
      let p1name = product1.name;
      let p1price = product1.price;
      let p2name = product2.name;
      let p2price = product2.price;
      if (p1name === p2name && p1price === p2price) {
        return true;
      } else {
        return false;
      } 
    }
    const p1 = {
      name: 'Laptop',
      price: 150000
    }
    const p2 = {
      name: 'Smartphone',
      price: 50000
    }
    console.log(`The cheaper product is ${comparePrice(p1, p2)}`);
    console.log(`Are the products same? ${isSameProduct(p1, p2)}`);

  </script>
</body>
</html>
