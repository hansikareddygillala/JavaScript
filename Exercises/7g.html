<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
</head>
<body>
  <script>
    function convertLength(length, from, to) {
      if (from === 'km') {
        if (to === 'miles'){
          return `${length/1.6} miles`;
        } else if (to === 'km') {
          return `${length} km`;
        } else if(to === 'ft') {
          return `${length*3281} ft`;
        } else {
        return `Invalid unit ${to}`;
      }

      } else if (from === 'miles') {
        if (to === 'km') {
          return `${length*1.6} km`;
        } else if (to === 'miles') {
          return `${length} miles`;
        } else if(to === 'ft') {
          return `${length*5280} ft`;
        } else {
        return `Invalid unit ${to}`;
      }
        
      } else if (from === 'ft') {
        if (to === 'km') {
          return `${length/3281} km`;
        } else if (to === 'miles') {
          return `${length/5280} miles`;
        } else if(to === 'ft') {
          return `${length} ft`;
        } else {
        return `Invalid unit ${to}`;
      }
      } else {
        return `Invalid unit: ${from}`;
      }
    }

    console.log(convertLength(50, 'miles', 'km')); // "80.45 km"
    console.log(convertLength(32, 'km', 'miles')); // "20 miles"
    console.log(convertLength(50,'km','km')); // "50 km"
    console.log(convertLength(5, 'miles', 'km')); // "0.03048 km"
    console.log(convertLength(5, 'miles', 'ft')); // "26400 ft"
    console.log(convertLength(5, 'km', 'ft')); // "16404.2 ft"
    console.log(convertLength(5, 'lbs', 'lbs')); // "0.001524 km"
  </script>
</body>
</html>
