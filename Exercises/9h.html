<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
</head>
<body>
  <input
    class="js-input"
    placeholder="Type Something"
    onkeyup="displayInput()">
  <p class="js-display"></p>
  <script>
    function displayInput() {
      document.querySelector('.js-display').innerHTML = document.querySelector('.js-input').value;
    }
  </script>
</body>
</html>
