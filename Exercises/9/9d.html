<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
</head>
<body>
  <input
    placeholder="Name"
    class="js-name-input"
    onkeydown="handleKeyDown(event)">
  <button 
    class="js-submit-button"
    onclick="displayName()">Submit</button>
  <p class="js-display"></p>

  <script>
    function displayName() {
      const text = document.querySelector('.js-name-input').value;
      document.querySelector('.js-display').innerHTML = `Your name is: ${text}`;
    }
    function handleKeyDown(event) {
      if (event.key === 'Enter') {
        displayName();
      }
    }
  </script>
</body>
</html>
