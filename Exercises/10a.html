<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
  <style>
    .add-to-cart-button {
      font-family: Arial;
      font-size: 16px;
      padding: 6px 50px;
      background-color: rgb(255, 216, 20);
      border:none;
      border-radius: 30px;
      display:block;
      margin-bottom: 20px;
    }
    .request-now {
      font-family: Arial;
      font-size: 14px;
      padding: 6px 20px;
      background-color: rgb(0, 0, 0);
      border:none;
      border-radius: 10px;
      display:block;
      color: white;
      font-weight: 600;
    }
    .schedule-for-later {
      font-family: Arial;
      font-size: 14px;
      padding: 6px 20px;
      background-color: rgb(230, 230, 230);
      border:none;
      border-radius: 10px;
      display:block;
      color: black;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <button class="add-to-cart-button">Add to Cart</button>
  <button class="request-now">Request now</button>
  <button class="schedule-for-later">Schedule for later</button>
  
</body>
</html>
