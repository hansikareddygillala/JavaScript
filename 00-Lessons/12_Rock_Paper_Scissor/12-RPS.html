<!DOCTYPE html>
<html lang="en">
<head>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="12-RPS.css">
</head>
<body>
  <p class="title">Rock Paper Scissors</p>
  <button onclick="
    playGame('Rock');"
    class="move-button"
    ><img class="move-icon" src="Images/rock-emoji.png"></button>

  <button onclick="
    playGame('Paper');"
    class="move-button"
    ><img class="move-icon" src="Images/paper-emoji.png"></button>
  
  <button onclick="
    playGame('Scissors');"
    class="move-button"
    ><img class="move-icon" src="Images/scissors-emoji.png"></button>

  <p class="js-result result"></p>
  <p class="js-moves">
  </p>
  <p class="js-score score"></p>

  <button 
    class="reset-score-button"
    onclick="
    score.Win = 0;
    score.Lose = 0;
    score.Tie = 0;
    localStorage.removeItem('score');
    updateScoreElement();
  ">Reset Score</button>

  <button
    class="auto-play-button"
    onclick="autoPlay()"
    >Auto Play</button>

  <script src="12-RPS.js"></script>
</body>
</html>

<!--This is a simple rock paper scissors game.
The user will click on one of the buttons and 
the computer will randomly choose one of the three options.
Then, the winner will be determined based on the rules of the game.

Steps(Algorithm):
1.Computer randomly selects a move
2. Compare the user's move with the computer's move to get the result
3. Display the result to the user

How to generate a random move for the computer?
We can use the Math.random() function to generate a random number between 0 and 1(in 0.somethingsomething)
if between 0 and 1/3 ----- rock
if between 1/3 and 2/3 --- paper
if between 2/3 and 1 ----- scissors

*Both the computerMove s are different because the both don't conflict with their scope
Following the code line-by-line is called tracing the code.










-->
