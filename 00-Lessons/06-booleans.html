<!DOCTYPE html>
<html lang="en">
<head>
  <title>Booleans</title>
</head>
<body>
  <script>
    
    console.log(3 > 5 - 5);
    console.log(5==='5.00');

    if (false) 
    {
      console.log('this will never run');
    }
    else
    {
      console.log('this will always run');
    }

//Checking if a person can drive are not with their age.
    
    let age = 18
    if (age >= 16)//{} are necessary for multiple statements.
    {
      console.log('You can drive.');
      console.log('Congratulations!');
    }
    else          //{} are not necessary for single statements.
      console.log('You cannot drive yet.');



    age = 15
    if (age >= 16)
    {
      console.log('You can drive.');
      console.log('Congratulations!');
    }

    else if (age >= 14)
      console.log('You can drive with a parent.');
    else
      console.log('You cannot drive yet.');
    
    //Logical Operators
    console.log(true && true); //true
    console.log(true && false); //false
    console.log(false && false); //false
    console.log(true || true); //true
    console.log(true || false); //true
    console.log(false || false); //false
    console.log(!true); //false
    console.log(!false); //true

    cartQuantity = 5;
    if (cartQuantity)
    {
      console.log('You have ' + cartQuantity + ' items in your cart.');
    }
    else
    {
      console.log('Your cart is empty.');
    }

    //Truthy and Falsy values
    if (5)
    {
      console.log('This will run because 5 is a truthy value.');
    }
    if (0)
    {
      console.log('This will not run because 0 is a falsy value.');
    }
    if ('')
    {
      console.log('This will not run because an empty string is a falsy value.');
    }
    if (' ')
    {
      console.log('This will run because a string with a space is a truthy value.');
    }
    if (null)
    {
      console.log('This will not run because null is a falsy value.');
    }
    console.log(!0); //true

    console.log('text'/5); //NaN, which is a falsy value.

    let var1;//cant use const because it needs to be assigned a value, but we want it to be undefined.
    console.log(var1); //undefined, which is a falsy value.
    const var2 = undefined;//if you want to use const, you can assign it the value of undefined.
    


    //Ternary Operator(Shorter form of if-else statement)
    const result = true ? 'Truthy' : 'Falsy';
    console.log(result);//truthy

    

    //Guard Operator && (Short Circuit Evaluation) 
    //First is false then other operand is not evaluated, and the result is false.
    //Short form of if statement, but it only executes the second operand if the first operand is true.
    false && console.log('This will not run because the first operand is false.');//Block the Code
    true && console.log('This will run because the first operand is true.');

    const message = false && 'Hello';
    console.log(message); //false, because the first operand is false, so the second operand is not evaluated.

    //In short,
    let message2;
    if(true)
    message2 = 'Hello';

    //Default Operator
    //First is true then other operand is not evaluated, and the result is the first operand.

    const currency1 = 'EUR' || 'USD';
    console.log(currency1); //EUR, because the first operand is truthy, so the second operand is not evaluated.

    const currency2 = undefined || 'USD';
    console.log(currency2);

    const currency3 = 'EUR' && 'USD';
    console.log(currency3);










  </script>
</body>
</html>

<!--{} are optional for single statements, but it's good practice to use them anyway

Falsy Values: false, 0, '', null, undefined, NaN(Not a Number)
Truthy Values: all values that are not falsy, including true, non-zero numbers, non-empty strings, objects, arrays, etc.










-->
