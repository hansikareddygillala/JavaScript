    //Truthy and Falsy values
    if (5)

    }
    if (0)

<!--{} are optional for single statements, but it's good practice to use them anyway

Falsy Values: false, 0, '', null, undefined, NaN(Not a Number)
Truthy Values: all values that are not falsy, including true, non-zero numbers, non-empty strings, objects, arrays, etc.
